<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: url("/images/background2.png") fixed;
      overflow: auto;
    }

    .error-container {
      text-align: center;
      padding: 40px;
      background: rgba(24, 24, 28, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
    }

    .error-code {
      font-size: 120px;
      font-weight: 700;
      background: linear-gradient(135deg, #7c6af7, #a594ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
    }

    .error-title {
      font-size: 24px;
      font-weight: 600;
      color: #f0eff4;
      margin-bottom: 12px;
    }

    .error-message {
      font-size: 14px;
      color: #9997a8;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: #7c6af7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .home-btn:hover {
      background: #a594ff;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="error-container">
    <div class="error-code glitch-text">404</div>
    <div class="error-title">Page Not Found</div>
    <p class="error-message">
      The page you're looking for doesn't exist lol.<br>
    </p>
    <a href="/" class="home-btn">
      Back
    </a>
  </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en-us">

<head>
  <script>
    (function () {
      const OrigWS = globalThis.WebSocket;
      globalThis.WebSocket = function (url, protocols) {
        console.log("[WS Intercept]", url);
        if (typeof url === "string" && url.includes("aetheris.win")) {
          url = url.replace(/wss?:\/\/aetheris\.win(:443)?(\/lc-relay)?/, "wss://wisp.chedar.dev/relay");
          console.log("[WS Redirected]", url);
        }
        return protocols !== undefined ? new OrigWS(url, protocols) : new OrigWS(url);
      };
      globalThis.WebSocket.prototype = OrigWS.prototype;
      Object.assign(globalThis.WebSocket, OrigWS);
    })();
  </script>

  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Lethal Company Web</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #unity-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      min-width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #000;
    }

    #unity-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      min-width: 100%;
      min-height: 100%;
      display: block;
      margin: 0;
      padding: 0;
      border: 0;
      outline: none;
      background: #000;
      touch-action: none;
    }

    #unity-loading-bar {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 10;
      display: flex;
      width: min(720px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      box-sizing: border-box;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      overflow: auto;
      transform: translate(-50%, -50%);
    }

    #unity-loading-bar.is-complete {
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #unity-logo {
      display: flex;
      width: min(400px, 100%);
      height: 200px;
      flex: 0 0 auto;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 16px;
      align-self: center;
      margin: 0 auto;
    }

    #unity-logo img {
      flex: 0 1 auto;
      max-width: calc((100% - 16px) / 2);
      object-fit: contain;
    }

    #unity-logo img:first-child {
      width: 200px;
      height: 160px;
    }

    #unity-logo img:last-child {
      width: 160px;
      height: 200px;
    }

    #unity-download-progress {
      display: grid;
      width: 100%;
      max-height: calc(100vh - 190px);
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 18px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .download-progress-item {
      display: grid;
      min-width: 0;
      grid-template-columns: 52px minmax(0, 1fr) 36px;
      align-items: center;
      gap: 8px;
      color: #ddd;
      font: 12px "Arial", monospace;
    }
    
    .download-progress-item span {
      min-width: 0;
      text-align: center;
      white-space: nowrap;
    }

    #unity-init-progress[hidden] {
      display: none;
    }

    .download-progress-track {
      height: 8px;
      overflow: hidden;
      background: #292929;
    }

    .download-progress-fill {
      width: 0%;
      height: 100%;
      background: #eee;
      transition: width 0.12s linear;
    }

    .download-progress-track.is-indeterminate .download-progress-fill {
      width: 30%;
      animation: download-indeterminate 1.1s ease-in-out infinite alternate;
    }

    .download-progress-value {
      color: #aaa;
      text-align: right;
      white-space: nowrap;
    }

    #unity-warning {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 8px 12px;
      display: none;
      z-index: 20;
      max-width: 90%;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #unity-init-progress {
      margin-top: 12px;
    }

    @keyframes download-indeterminate {
      from { transform: translateX(0); }
      to { transform: translateX(230%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .download-progress-track.is-indeterminate .download-progress-fill {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="1920" height="1080"></canvas>

    <div id="unity-loading-bar" aria-label="Loading Unity game">
      <div id="unity-logo" aria-hidden="true">
        <img src="zeekerss.png" alt="Zeekerss Studios Logo">
        <img src="unity-black.jpg" alt="Unity logo">
        <img src="chedar.webp" alt="Chedar Logo">
      </div>
      <div id="unity-download-progress" role="group" aria-label="Download progress"></div>
      <div id="unity-init-progress" class="download-progress-item" hidden>
        <span>UNITY</span>
        <div
          id="unity-init-track"
          class="download-progress-track"
          role="progressbar"
          aria-label="Unity initialization progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="unity-init-fill" class="download-progress-fill"></div>
        </div>
        <span id="unity-init-value" class="download-progress-value">0%</span>
      </div>
    </div>

    <div id="unity-warning" role="alert"></div>
  </div>

  <script>
    const canvas = document.getElementById("unity-canvas");
    const loadingBar = document.getElementById("unity-loading-bar");
    const downloadProgress = document.getElementById("unity-download-progress");
    const unityInitProgress = document.getElementById("unity-init-progress");
    const unityInitTrack = document.getElementById("unity-init-track");
    const unityInitFill = document.getElementById("unity-init-fill");
    const unityInitValue = document.getElementById("unity-init-value");
    const warning = document.getElementById("unity-warning");

    const wispProtocol = location.protocol === "https:" ? "wss:" : "ws:";
    const wispPort = location.port ? ":" + location.port : "";

    window.WISP_URL = "wss://wisp.chedar.dev"

    window.WispRelayWSState = {
      sock: null,
      recvPtr: 0,
      sid: 0,
      url: window.WISP_URL
    };

    console.log("[wisp] endpoint:", window.WISP_URL);

    function resizeCanvas() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      canvas.width = width;
      canvas.height = height;

      if (window.unityInstance) {
        try {
          window.unityInstance.SendMessage(
            "WebGLInput",
            "SetCanvasSize",
            width + "," + height
          );
        } catch (e) {
        }
      }
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);

    resizeCanvas();

    function unityShowBanner(message, type) {
      warning.textContent = message;

      if (type === "error") {
        warning.style.display = "block";
      } else {
        warning.style.display = "none";
      }

      console.log("[unity]", type || "info", message);
    }

    function createDownloadProgressBar(label) {
      const row = document.createElement("div");
      row.className = "download-progress-item";

      const name = document.createElement("span");
      name.textContent = label;

      const track = document.createElement("div");
      track.className = "download-progress-track";
      track.setAttribute("role", "progressbar");
      track.setAttribute("aria-label", label + " download progress");
      track.setAttribute("aria-valuemin", "0");
      track.setAttribute("aria-valuemax", "100");
      track.setAttribute("aria-valuenow", "0");

      const fill = document.createElement("div");
      fill.className = "download-progress-fill";
      track.appendChild(fill);

      const value = document.createElement("span");
      value.className = "download-progress-value";
      value.textContent = "0%";

      row.append(name, track, value);
      downloadProgress.appendChild(row);

      return {
        fill: fill,
        track: track,
        value: value,
        lastPercent: -1
      };
    }

    function updateDownloadProgress(progressBar, receivedBytes, totalBytes) {
      if (totalBytes > 0) {
        const percent = Math.min(100, receivedBytes / totalBytes * 100);
        const rounded = Math.round(percent);

        if (rounded !== progressBar.lastPercent) {
          progressBar.fill.style.width = percent + "%";
          progressBar.track.setAttribute("aria-valuenow", String(rounded));
          progressBar.value.textContent = rounded + "%";
          progressBar.track.classList.remove("is-indeterminate");
          progressBar.lastPercent = rounded;
        }
      } else {
        progressBar.track.classList.add("is-indeterminate");
        progressBar.value.textContent = (receivedBytes / 1048576).toFixed(0) + "M";
      }
    }

    async function downloadPart(candidates, mimeType, progressBar, signal) {
      let response = null;
      let partUrl = candidates[0];

      for (const candidate of candidates) {
        partUrl = candidate;
        response = await fetch(partUrl, {
          method: "GET",
          signal: signal
        });

        if (response.ok) break;
      }

      if (!response.ok) {
        throw new Error("Failed to load " + partUrl + " (" + response.status + ")");
      }

      const contentType = response.headers.get("content-type") || "";

      if (contentType.includes("text/html")) {
        throw new Error("Part returned HTML instead of binary: " + partUrl);
      }

      const totalBytes = Number(response.headers.get("content-length")) || 0;
      const chunks = [];
      let receivedBytes = 0;

      if (response.body) {
        const reader = response.body.getReader();

        while (true) {
          const result = await reader.read();
          if (result.done) break;

          chunks.push(result.value);
          receivedBytes += result.value.byteLength;
          updateDownloadProgress(progressBar, receivedBytes, totalBytes);
        }
      } else {
        const buffer = await response.arrayBuffer();
        chunks.push(buffer);
        receivedBytes = buffer.byteLength;
      }

      if (receivedBytes === 0) {
        throw new Error("Part is empty: " + partUrl);
      }

      const part = new Blob(chunks, { type: mimeType });

      if (part.size < 1024) {
        const head = new TextDecoder().decode(await part.slice(0, 200).arrayBuffer());
        if (head.includes("<!") || head.includes("<html")) {
          throw new Error("Part looks like an HTML error page: " + partUrl);
        }
      }

      progressBar.track.classList.remove("is-indeterminate");
      progressBar.fill.style.width = "100%";
      progressBar.track.setAttribute("aria-valuenow", "100");
      progressBar.value.textContent = "100%";

      return part;
    }

    async function loadSplitFile(url, expectedParts, mimeType, label, signal) {
      const padWidth = String(expectedParts).length;
      const downloads = [];

      for (let i = 1; i <= expectedParts; i++) {
        const padded = String(i).padStart(padWidth, "0");
        const candidates = padded === String(i)
          ? [url + ".part" + i]
          : [url + ".part" + padded, url + ".part" + i];
        const partLabel = label + " " + String(i).padStart(2, "0");
        const progressBar = createDownloadProgressBar(partLabel);

        downloads.push(downloadPart(candidates, mimeType, progressBar, signal));
      }

      const parts = await Promise.all(downloads);
      const combined = new Blob(parts, { type: mimeType });

      return URL.createObjectURL(combined);
    }

    function loadUnityLoader() {
      return new Promise((resolve, reject) => {
        if (typeof createUnityInstance === "function") {
          resolve();
          return;
        }

        const script = document.createElement("script");

        script.src = "https://cdn.chedar.dev/lethal-company/build.loader.js";
        script.async = true;

        script.onload = () => {
          console.log("[unity] build.loader.js loaded");

          if (typeof createUnityInstance !== "function") {
            reject(
              new Error(
                "build.loader.js loaded but createUnityInstance is still undefined"
              )
            );
            return;
          }

          resolve();
        };

        script.onerror = () => {
          reject(
            new Error(
              "Could not load https://cdn.chedar.dev/lethal-company/build.loader.js"
            )
          );
        };

        document.head.appendChild(script);
      });
    }

    async function startUnity() {
      let dataUrl = null;
      let wasmUrl = null;

      try {
        loadingBar.style.display = "block";

        console.log("[unity] loading Unity loader");

        await loadUnityLoader();

        console.log("[unity] Unity loader ready");
        console.log("[unity] preparing build files");

        const downloadController = new AbortController();

        try {
          [dataUrl, wasmUrl] = await Promise.all([
            loadSplitFile(
              "https://cdn.chedar.dev/lethal-company/build.data",
              18,
              "application/octet-stream",
              "DATA",
              downloadController.signal
            ),
            loadSplitFile(
              "https://cdn.chedar.dev/lethal-company/build.wasm",
              5,
              "application/wasm",
              "WASM",
              downloadController.signal
            )
          ]);
        } catch (error) {
          downloadController.abort();
          throw error;
        }

        console.log("[unity] data and wasm ready");

        resizeCanvas();

        const config = {
          dataUrl: dataUrl,

          frameworkUrl: "https://cdn.chedar.dev/lethal-company/build.framework.js",

          codeUrl: wasmUrl,

          streamingAssetsUrl: "https://cdn.chedar.dev/lethal-company/StreamingAssets",

          companyName: "puiaiiu ports",

          productName: "Lethal Company",

          productVersion: "0.1",

          matchWebGLToCanvasSize: true,

          showBanner: unityShowBanner,

          webglContextAttributes: {
            antialias: false,
            preserveDrawingBuffer: true,
            powerPreference: "high-performance",
            failIfMajorPerformanceCaveat: false
          }
        };

        console.log("[unity] creating Unity instance");
        unityInitProgress.hidden = false;

        const instance = await createUnityInstance(
          canvas,
          config,
          function (progress) {
            const percent = Math.round(progress * 100);

            unityInitFill.style.width = Math.max(0, Math.min(100, progress * 100)) + "%";
            unityInitTrack.setAttribute("aria-valuenow", String(percent));
            unityInitValue.textContent = percent + "%";
          }
        );

        window.unityInstance = instance;

        resizeCanvas();

        console.log("[unity] Unity loaded");

        loadingBar.classList.add("is-complete");
        window.setTimeout(function () {
          loadingBar.style.display = "none";
        }, 500);

      } catch (error) {
        console.error(
          "[unity] failed to load:",
          error
        );

        unityShowBanner(
          "Unity failed to load: " + error.message,
          "error"
        );
      }
    }

    window.addEventListener("load", function () {
      console.log("[unity] loader loaded");

      startUnity();
    });
  </script>
</body>

</html>
